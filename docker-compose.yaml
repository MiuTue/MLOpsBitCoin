services:
  # Redpanda service
  binance-redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: binance-redpanda
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "1"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://binance-redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:28082,OUTSIDE://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://binance-redpanda:28082,OUTSIDE://localhost:8082
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - binance-redpanda:33145
    ports:
      - 8081:8081
      - 8082:8082
      - 9092:9092
      - 9644:9644
      - 28082:28082
      - 29092:29092
    networks:
      - binance-network
    healthcheck:
      test: [ "CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1" ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Redpanda Console for UI
  binance-redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.4.6
    container_name: binance-redpanda-console
    entrypoint: /bin/sh
    command: -c "/app/console"
    environment:
      CONFIG_FILEPATH: /etc/console-config.yaml
    volumes:
      - ./console-config.yaml:/etc/console-config.yaml
    ports:
      - 1003:8080
    networks:
      - binance-network
    depends_on:
      binance-redpanda:
        condition: service_healthy

  # binanceProducer service
  binance-producer:
    build:
      context: ./BinanceProducer
      dockerfile: Dockerfile
    container_name: binance-producer
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS}
      ASSET_PRICES_TOPIC: ${ASSET_PRICES_TOPIC}
    networks:
      - binance-network
    depends_on:
      binance-redpanda:
        condition: service_healthy

  # binanceConsumer service
  binance-consumer:
    build:
      context: ./BinanceConsumer
      dockerfile: Dockerfile
    container_name: binance-consumer
    ports:
      - 9090:8080
      - 7014:7077
      - 4010:4040
    environment:
      SPARK_MASTER: "local[*]"
      REDPANDA_BROKERS: ${REDPANDA_BROKERS}
      ASSET_PRICES_TOPIC: ${ASSET_PRICES_TOPIC}
      ASSET_SCHEMA_LOCATION: ${ASSET_SCHEMA_LOCATION:-/src/schemas/assets.avsc}
      ASSET_CASSANDRA_HOST: ${ASSET_CASSANDRA_HOST}
      ASSET_CASSANDRA_PORT: ${ASSET_CASSANDRA_PORT}
      ASSET_CASSANDRA_USERNAME: ${ASSET_CASSANDRA_USERNAME}
      ASSET_CASSANDRA_PASSWORD: ${ASSET_CASSANDRA_PASSWORD}
      ASSET_CASSANDRA_KEYSPACE: ${ASSET_CASSANDRA_KEYSPACE}
      ASSET_CASSANDRA_TABLE: ${ASSET_CASSANDRA_TABLE}
    networks:
      - binance-network
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      binance-redpanda:
        condition: service_healthy
      binance-cassandra:
        condition: service_healthy
      binance-cassandra-init:
        condition: service_completed_successfully

  binance-consumer-worker-1:
    build:
      context: ./BinanceConsumer
      dockerfile: SparkWorker.DockerFile
    container_name: binance-consumer-worker-1
    ports:
      - 8041:8081
    networks:
      - binance-network
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - binance-consumer
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}

  binance-consumer-worker-2:
    build:
      context: ./BinanceConsumer
      dockerfile: SparkWorker.DockerFile
    container_name: binance-consumer-worker-2
    ports:
      - 8042:8081
    networks:
      - binance-network
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - binance-consumer
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1g
      SPARK_MASTER_URL: ${SPARK_MASTER_URL}

  # Cassandra service
  binance-cassandra:
    image: cassandra:4.1.3
    container_name: binance-cassandra
    ports:
      - 9042:9042
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    networks:
      - binance-network
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: [ "CMD-SHELL", "[ $$(nodetool statusgossip) = running ]" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Cassandra initialization service
  binance-cassandra-init:
    image: cassandra:4.1.3
    container_name: binance-cassandra-init
    depends_on:
      binance-cassandra:
        condition: service_healthy
    networks:
      - binance-network
    volumes:
      - ./init-cassandra.sh:/init-cassandra.sh
    command: 
      - /bin/bash
      - -c
      - "tr -d '\r' < /init-cassandra.sh > /tmp/init.sh && chmod +x /tmp/init.sh && /tmp/init.sh"

  binance-grafana:
    image: grafana/grafana-enterprise
    container_name: binance-grafana
    restart: unless-stopped
    depends_on:
      binance-cassandra:
        condition: service_healthy
    networks:
      - binance-network
    ports:
      - 3000:3000
    environment:
      - GF_INSTALL_PLUGINS=hadesarchitect-cassandra-datasource
      - GF_PUBLIC_DASHBOARDS_ENABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./Grafana/datasources/cassandra.yaml:/etc/grafana/provisioning/datasources/cassandra.yaml
      - ./Grafana/dashboard_provider.yaml:/etc/grafana/provisioning/dashboards/provider.yaml
      - ./Grafana/dashboards:/var/lib/grafana/dashboards

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: binance-mlflow
    ports:
      - 5000:5000
    networks:
      - binance-network
    command: >
      mlflow server 
      --backend-store-uri sqlite:///mlflow.db 
      --default-artifact-root /mlflow-artifacts 
      --host 0.0.0.0
    volumes:
      - mlflow-data:/mlflow-artifacts

  # LSTM Training Service (Runs once or on schedule)
  binance-trainer:
    build:
      context: ./BinanceConsumer
      dockerfile: Dockerfile
    container_name: binance-trainer
    entrypoint: ["python", "/src/models/train_lstm.py"]
    environment:
      REDPANDA_BROKERS: ${REDPANDA_BROKERS}
      ASSET_CASSANDRA_HOST: ${ASSET_CASSANDRA_HOST}
      ASSET_CASSANDRA_PORT: ${ASSET_CASSANDRA_PORT}
      ASSET_CASSANDRA_KEYSPACE: ${ASSET_CASSANDRA_KEYSPACE}
      ASSET_CASSANDRA_TABLE: ${ASSET_CASSANDRA_TABLE}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - binance-network
    volumes:
      - ./models:/src/models
    depends_on:
      - mlflow
      - binance-cassandra

  # Serving API (FastAPI)
  binance-serving:
    image: python:3.10-slim
    container_name: binance-serving
    working_dir: /app
    ports:
      - 8000:8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    networks:
      - binance-network
    volumes:
      - ./Serving:/app
      - ./BinanceConsumer/requirements.txt:/app/requirements.txt
    command: >
      sh -c "pip install -r requirements.txt fastapi uvicorn && python app.py"
    depends_on:
      - mlflow

volumes:
  grafana-data: {}
  mlflow-data: {}

networks:
  binance-network:
    driver: bridge
